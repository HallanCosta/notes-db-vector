services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notes-postgres
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.docker/postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-server
    ports:
      - "127.0.0.1:8003:8000"
    env_file:
      - path: server/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/notes
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_DIMENSIONS=2560
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:4b
    volumes:
      - ./server:/app/server
    working_dir: /app/server
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - app-network

  # Ollama (LLM Server)
  ollama:
    image: ollama/ollama:latest
    container_name: notes-ollama
    volumes:
      - ./.docker/ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_GPU_LAYERS=999
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
