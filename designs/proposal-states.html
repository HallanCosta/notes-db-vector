<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes design proposals</title>
    <style>
      :root {
        --ink: #14151b;
        --muted: #737783;
        --line: #e8e9ef;
        --surface: #ffffff;
        --canvas: #f7f8fc;
        --purple: #7c3aed;
        --purple-dark: #6424d8;
        --purple-soft: #f0eaff;
        --blue-soft: #eaf3ff;
        --green: #23a06b;
        --shadow: 0 18px 42px rgba(37, 25, 71, 0.09), 0 2px 8px rgba(25, 28, 43, 0.04);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; width: 100vw; height: 100vh; color: var(--ink); background: var(--canvas); overflow: hidden; }
      button, input { font: inherit; }
      .app { display: grid; grid-template-columns: 238px 1fr; height: 100%; }
      .sidebar { display: flex; flex-direction: column; padding: 27px 14px 18px; background: rgba(255, 255, 255, 0.96); border-right: 1px solid var(--line); }
      .brand { display: flex; align-items: center; gap: 11px; padding: 0 14px 34px; font-size: 18px; font-weight: 760; letter-spacing: -0.03em; }
      .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; color: white; border-radius: 9px; background: linear-gradient(145deg, #9a5cff, #6d28d9); box-shadow: 0 6px 14px rgba(124, 58, 237, .26); }
      .brand-mark svg { width: 16px; height: 16px; }
      .nav { display: grid; gap: 7px; }
      .nav-item { display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 13px; color: #4f525d; border: 1px solid transparent; border-radius: 12px; font-size: 13px; font-weight: 650; }
      .nav-item.active { color: var(--ink); border-color: #c7b7ff; background: linear-gradient(100deg, #f5f1ff, #fbfaff); box-shadow: 0 3px 10px rgba(124, 58, 237, .08); }
      .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
      .sidebar-footer { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 18px 13px 0; color: #8b8e98; font-size: 12px; }
      .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px #e5f7ee; }
      .main { min-width: 0; padding: 26px 34px 28px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 22px; }
      .search { display: flex; align-items: center; gap: 11px; width: min(580px, 100%); height: 48px; padding: 0 16px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 5px 15px rgba(30, 32, 49, .04); }
      .search svg { flex: 0 0 auto; width: 18px; height: 18px; stroke: #6f7280; fill: none; stroke-width: 1.8; }
      .search input { width: 100%; color: var(--ink); background: transparent; border: 0; outline: 0; font-size: 13px; }
      .search input::placeholder { color: #9a9da8; }
      .primary { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; color: white; border: 0; border-radius: 13px; background: linear-gradient(135deg, #8b3dff, #7018e9); box-shadow: 0 9px 18px rgba(112, 24, 233, .24); font-size: 13px; font-weight: 750; }
      .primary svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; }
      .eyebrow { margin-top: 35px; color: #8b7bb7; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1 { margin: 8px 0 0; font-size: 27px; line-height: 1.1; letter-spacing: -0.045em; }
      .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
      .stage { position: relative; display: grid; place-items: center; min-height: 510px; margin-top: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: radial-gradient(circle at 50% 40%, #fff 0, #fbfbfe 44%, #f5f5fa 100%); }
      .stage::before, .stage::after { content: ""; position: absolute; border-radius: 50%; filter: blur(1px); pointer-events: none; }
      .stage::before { width: 280px; height: 280px; top: -120px; right: 4%; background: rgba(220, 206, 255, .29); }
      .stage::after { width: 220px; height: 220px; bottom: -130px; left: 12%; background: rgba(194, 225, 255, .28); }
      .empty-card { position: relative; z-index: 1; width: 590px; padding: 20px 28px 25px; text-align: center; }
      .empty-art { position: relative; width: 174px; height: 134px; margin: 0 auto 22px; }
      .sheet { position: absolute; width: 88px; height: 108px; border-radius: 15px; border: 1px solid #d9d2ff; background: white; box-shadow: 0 13px 22px rgba(81, 49, 155, .09); }
      .sheet.back { left: 31px; top: 8px; transform: rotate(-11deg); background: #f0eaff; }
      .sheet.middle { left: 47px; top: 3px; transform: rotate(7deg); background: #f8f6ff; }
      .sheet.front { left: 43px; top: 17px; transform: rotate(-1deg); }
      .sheet.front::before, .sheet.front::after { content: ""; position: absolute; left: 17px; height: 6px; border-radius: 8px; background: #e6ddff; }
      .sheet.front::before { top: 25px; width: 49px; }
      .sheet.front::after { top: 41px; width: 34px; background: #f0edf8; }
      .spark { position: absolute; color: #8b5cf6; font-size: 21px; }
      .spark.one { left: 13px; top: 28px; }
      .spark.two { right: 11px; top: 51px; font-size: 15px; color: #5c9dff; }
      .spark.three { right: 28px; top: 6px; font-size: 12px; color: #f6a83d; }
      .empty-card h2 { margin: 0; font-size: 22px; letter-spacing: -0.035em; }
      .empty-card p { max-width: 420px; margin: 10px auto 19px; color: var(--muted); font-size: 13px; line-height: 1.55; }
      .secondary { height: 39px; padding: 0 15px; color: var(--purple-dark); border: 1px solid #d7c9ff; border-radius: 11px; background: #fff; font-size: 12px; font-weight: 750; }
      .search-state { position: relative; z-index: 1; width: 560px; padding: 20px; text-align: center; }
      .search-art { display: grid; place-items: center; width: 86px; height: 86px; margin: 0 auto 20px; color: var(--purple); border-radius: 26px; background: linear-gradient(145deg, #f2edff, #e9f3ff); }
      .search-art svg { width: 39px; height: 39px; stroke: currentColor; fill: none; stroke-width: 1.45; }
      .search-state h2 { margin: 0; font-size: 21px; letter-spacing: -0.03em; }
      .search-state p { margin: 10px auto 19px; color: var(--muted); font-size: 13px; }
      .suggestions { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; }
      .suggestion { padding: 9px 12px; color: #5d536e; border: 1px solid #e8e2f8; border-radius: 10px; background: #fff; font-size: 11px; font-weight: 650; }
      .chat-shell { position: relative; z-index: 1; display: grid; grid-template-rows: auto 1fr auto; width: min(850px, calc(100% - 70px)); height: 430px; overflow: hidden; border: 1px solid #e5e3ed; border-radius: 18px; background: #fff; box-shadow: var(--shadow); }
      .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 19px; border-bottom: 1px solid var(--line); }
      .chat-title { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 800; }
      .ai-mark { display: grid; place-items: center; width: 30px; height: 30px; color: white; border-radius: 10px; background: linear-gradient(145deg, #9a5cff, #6d28d9); }
      .ai-mark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
      .chat-action { color: #9a9ca7; border: 0; background: transparent; }
      .chat-body { display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 50% 48%, #fbfaff, #fff 48%); }
      .welcome { width: min(570px, 100%); text-align: center; }
      .welcome-orb { position: relative; display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto 16px; color: white; border-radius: 22px; background: linear-gradient(145deg, #a065ff, #6c28d9); box-shadow: 0 13px 27px rgba(109, 40, 217, .22); }
      .welcome-orb::after { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(255,255,255,.45); border-radius: 17px; }
      .welcome-orb svg { position: relative; z-index: 1; width: 29px; height: 29px; stroke: currentColor; fill: none; stroke-width: 1.5; }
      .welcome h2 { margin: 0; font-size: 22px; letter-spacing: -0.04em; }
      .welcome p { margin: 8px 0 21px; color: var(--muted); font-size: 13px; }
      .prompts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .prompt { min-height: 61px; padding: 12px; text-align: left; color: #4d4960; border: 1px solid #e8e2f8; border-radius: 12px; background: #fff; box-shadow: 0 4px 10px rgba(47, 28, 83, .04); font-size: 11px; line-height: 1.35; }
      .prompt span { display: block; margin-bottom: 7px; color: var(--purple); font-size: 16px; }
      .chat-input { display: flex; align-items: center; gap: 11px; margin: 0 14px 14px; padding: 6px 8px 6px 15px; border: 1px solid #e2e1e9; border-radius: 13px; background: #fff; box-shadow: 0 5px 15px rgba(40, 31, 68, .05); }
      .chat-input span { flex: 1; color: #a1a3ac; font-size: 12px; }
      .send { display: grid; place-items: center; width: 34px; height: 34px; color: white; border: 0; border-radius: 10px; background: var(--purple); }
      .send svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
      .caption { position: absolute; right: 20px; bottom: 16px; z-index: 2; color: #a3a4ad; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
      @media (max-width: 760px) {
        .app { grid-template-columns: 76px 1fr; }
        .brand { justify-content: center; padding: 0 0 34px; }
        .brand span, .nav-item span, .sidebar-footer span { display: none; }
        .nav-item { justify-content: center; padding: 0; }
        .sidebar-footer { justify-content: center; padding-left: 0; padding-right: 0; }
        .main { padding: 18px; }
        .primary { padding: 0 12px; }
        .primary span { display: none; }
        .stage { min-height: 510px; }
        .chat-shell { width: calc(100% - 18px); }
        .prompts { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const icons = {
        note: '<svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4M9 13h6M9 16h6"/></svg>',
        chat: '<svg viewBox="0 0 24 24"><path d="M5 5.5h14v10H9l-4 3v-13z"/></svg>',
        search: '<svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.3 4.3"/></svg>',
        plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
        sparkle: '<svg viewBox="0 0 24 24"><path d="m12 3 1.4 5.1L18 10l-4.6 1.9L12 17l-1.4-5.1L6 10l4.6-1.9zM19 15l.6 2.4L22 18l-2.4.6L19 21l-.6-2.4L16 18l2.4-.6z"/></svg>',
        send: '<svg viewBox="0 0 24 24"><path d="m4 4 16 8-16 8 3-8zM7 12h13"/></svg>'
      };

      const state = new URLSearchParams(location.search).get('state') || 'empty';
      const active = state === 'chat' ? 'chat' : 'note';
      const content = {
        empty: {
          eyebrow: 'A calmer place for your ideas',
          title: 'Turn your thoughts into knowledge',
          subtitle: 'Create your first note and start building a personal knowledge base.',
          stage: `<div class="empty-card"><div class="empty-art"><div class="sheet back"></div><div class="sheet middle"></div><div class="sheet front"></div><span class="spark one">✦</span><span class="spark two">✧</span><span class="spark three">·</span></div><h2>Your knowledge base starts here</h2><p>Capture an idea, save a reference, or write down what you learned. Your notes will become searchable and ready for AI.</p><button class="secondary">${icons.plus} Create your first note</button></div><div class="caption">Empty state proposal · P1</div>`
        },
        search: {
          eyebrow: 'Search your knowledge base',
          title: 'Nothing matched this search',
          subtitle: 'A more helpful empty state keeps the next action close at hand.',
          stage: `<div class="search-state"><div class="search-art">${icons.search}</div><h2>No notes found for “quantum computing”</h2><p>Try a broader phrase, clear the search, or create a new note.</p><div class="suggestions"><div class="suggestion">Clear search</div><div class="suggestion">Browse all notes</div><div class="suggestion">Create a note</div></div></div><div class="caption">No results proposal · P1</div>`
        },
        chat: {
          eyebrow: 'A thoughtful copilot for your notes',
          title: 'Ask questions. Find connections.',
          subtitle: 'A more welcoming starting point for Chat AI.',
          stage: `<div class="chat-shell"><div class="chat-header"><div class="chat-title"><div class="ai-mark">${icons.sparkle}</div><span>Chat AI</span></div><button class="chat-action">•••</button></div><div class="chat-body"><div class="welcome"><div class="welcome-orb">${icons.sparkle}</div><h2>Ask anything about your notes</h2><p>Start with a prompt below or ask in your own words.</p><div class="prompts"><div class="prompt"><span>✦</span>Summarize my latest notes</div><div class="prompt"><span>⌁</span>What ideas connect across my notes?</div><div class="prompt"><span>↗</span>Help me turn a note into a plan</div></div></div></div><div class="chat-input"><span>Ask about your notes...</span><button class="send">${icons.send}</button></div></div><div class="caption">Chat welcome proposal · P1</div>`
        }
      }[state] || null;

      const fallback = content || {
        eyebrow: 'A calmer place for your ideas',
        title: 'Turn your thoughts into knowledge',
        subtitle: 'Create your first note and start building a personal knowledge base.',
        stage: ''
      };

      document.querySelector('#app').innerHTML = `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">${icons.note}</div><span>Notes</span></div><nav class="nav"><div class="nav-item ${active === 'note' ? 'active' : ''}">${icons.note}<span>All Notes</span></div><div class="nav-item ${active === 'chat' ? 'active' : ''}">${icons.chat}<span>Chat AI</span></div></nav><div class="sidebar-footer"><div class="status-dot"></div><span>Local workspace</span></div></aside><main class="main"><div class="topbar"><label class="search">${icons.search}<input value="${state === 'search' ? 'quantum computing' : ''}" placeholder="Search your notes..." /></label><button class="primary">${icons.plus}<span>New Note</span></button></div><div class="eyebrow">${fallback.eyebrow}</div><h1>${fallback.title}</h1><p class="subtitle">${fallback.subtitle}</p><section class="stage">${fallback.stage}</section></main></div>`;
    </script>
  </body>
</html>
